<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Quarter - Live Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #F9F6F1; 
            --card-bg: #ffffff; 
            --text-main: #1D1D1D;
            --text-muted: #666362;
            --accent: #D97757; 
            --accent-soft: #E8E2D9;
            --border: #E5E0D8;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .section-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-left: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .loader {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .leaderboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            display: grid;
            grid-template-columns: 20px 130px 75px 1fr auto;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .rank-number {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .rank-1 .rank-number { color: #B38E1B; }
        .rank-2 .rank-number { color: #7D7D7D; }
        .rank-3 .rank-number { color: #A67C52; }

        .user-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rings-container {
            display: flex;
            gap: 3px;
        }

        .day-ring {
            width: 7px;
            height: 7px;
            border-radius: 1.5px;
            background-color: var(--accent-soft);
        }

        .day-ring.active { background-color: var(--accent); }

        .progress-mini {
            height: 2px;
            background: var(--accent-soft);
            border-radius: 1px;
            width: 100%;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0;
            transition: width 1s ease-out;
        }

        .score-box { text-align: right; }
        .score-value { font-size: 13px; font-weight: 700; }
        .score-total { font-size: 10px; color: var(--text-muted); opacity: 0.6; }

        .compact-container { max-width: 520px; margin: 0 auto; }
        
        @media (max-width: 420px) {
            .leaderboard-card { grid-template-columns: 15px 110px 70px 1fr auto; }
        }
    </style>
</head>
<body class="py-5 px-3">

    <div class="compact-container">
        <div class="section-header">
            <span>Еженедельный мониторинг активности</span>
            <span id="status" class="loader">Загрузка...</span>
        </div>
        <div id="tracks-container" class="space-y-1">
            <!-- Сюда попадут данные из таблицы -->
        </div>
    </div>

    <script>
        /**
         * ВАЖНО: Сюда нужно вставить реальный URL, полученный после "Deploy" в Google Apps Script.
         * Ошибка "URL is not valid" возникает, если оставить здесь текст на кириллице.
         */
        const SCRIPT_URL = ""; 

        async function fetchData() {
            const statusEl = document.getElementById('status');
            
            // Если ссылка не указана, сразу показываем демо-данные без попытки fetch
            if (!SCRIPT_URL || SCRIPT_URL.includes("ВАША_ССЫЛКА")) {
                console.warn("SCRIPT_URL не настроен. Используются демо-данные.");
                statusEl.textContent = "Демо-режим";
                statusEl.style.animation = "none";
                renderDemo();
                return;
            }

            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                render(data);
                statusEl.textContent = "Обновлено";
                statusEl.style.animation = "none";
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                statusEl.textContent = "Ошибка связи";
                renderDemo();
            }
        }

        function render(participants) {
            const container = document.getElementById('tracks-container');
            if (!participants || !Array.isArray(participants)) return;

            const sorted = participants
                .map(p => ({
                    ...p,
                    total: Array.isArray(p.data) ? p.data.reduce((a, b) => a + b, 0) : 0
                }))
                .sort((a, b) => b.total - a.total);

            container.innerHTML = sorted.map((p, i) => {
                const rank = i + 1;
                const progressWidth = (p.total / 7) * 100;
                const rings = p.data.map(a => `<div class="day-ring ${a ? 'active' : ''}"></div>`).join('');
                
                return `
                    <div class="leaderboard-card rank-${rank}">
                        <div class="rank-number">${rank}</div>
                        <div class="user-name">${p.name}</div>
                        <div class="rings-container">${rings}</div>
                        <div class="progress-mini">
                            <div class="progress-fill" style="width: ${progressWidth}%"></div>
                        </div>
                        <div class="score-box">
                            <span class="score-value">${p.total}</span><span class="score-total">/7</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDemo() {
            const demoData = [
                { name: "Соломин Денис (Демо)", data: [1, 1, 1, 1, 1, 1, 0] },
                { name: "Бодянчук Виталий (Демо)", data: [1, 0, 1, 1, 1, 1, 0] },
                { name: "Соломин Антон (Демо)", data: [1, 1, 1, 1, 1, 0, 0] }
            ];
            render(demoData);
        }

        window.onload = fetchData;
    </script>
</body>
</html>
