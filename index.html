<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Quarter - Live Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-main: #F9F6F1; 
            --card-bg: #ffffff; 
            --text-main: #1D1D1D;
            --text-muted: #666362;
            --accent: #708A74; 
            --accent-soft: #E8E2D9;
            --border: #E5E0D8;
            --active-day: #D97757; 
            --status-ok: #8A8785; 
            --streak-fire: #E87B4A; /* Цвет active огонька */
            --streak-inactive: #C4C2BC; /* Цвет inactive огонька */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .section-header {
            margin-bottom: 20px;
            padding: 0 4px 0 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 15px;
            letter-spacing: -0.01em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .section-title i {
            font-size: 12px;
            color: var(--active-day);
            opacity: 0.9;
        }

        .section-title span { font-weight: 400; color: var(--text-muted); }
        .section-title strong { font-weight: 700; color: var(--text-main); }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .anim-pulse { animation: pulse 1.5s infinite; }

        /* Революционная интерактивная шапка-панель */
        .leaderboard-header {
            display: grid;
            grid-template-columns: 20px 1fr 100px 180px; /* Слегка расширили колонку даты для свободного размещения */
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            margin-bottom: 16px;
            background: rgba(229, 224, 216, 0.25);
            border: 1px solid rgba(229, 224, 216, 0.6);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            user-select: none;
        }

        .header-section-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Премиальный классический бадж недели — утонченная высота */
        .header-stat-bubble {
            background-color: var(--accent);
            color: #ffffff;
            font-size: 9px;
            font-weight: 700;
            padding: 0 10px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 1px 2px rgba(112, 138, 116, 0.08);
            height: 23px; /* Идеальная компактная высота */
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Премиальный сплит-бадж цели недели — утонченная высота */
        .header-split-bubble {
            display: inline-flex;
            align-items: center;
            background-color: #2D312E; 
            border-radius: 100px;
            padding: 2px; /* Уменьшенный отступ рамки */
            border: 1px solid rgba(112, 138, 116, 0.1);
            user-select: none;
            box-shadow: 0 2px 5px rgba(45, 49, 46, 0.05);
            margin-right: 4px; 
            height: 23px; /* Высота строго совпадает с левым баджем недели */
        }

        .bubble-label {
            font-size: 7.5px;
            font-weight: 700;
            color: rgba(232, 226, 217, 0.9);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0 6px 0 6px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        /* Белая nested-плашка — аккуратная высота под формат 23px */
        .bubble-value {
            background-color: #ffffff;
            border-radius: 98px; 
            padding: 0 7px;
            height: 100%; /* Автоматически заполняет внутреннее пространство */
            display: inline-flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        /* Главная цифра цели — соразмерный масштаб */
        .goal-value-accent {
            font-size: 11.5px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
        }

        /* Второстепенная часть цели — соразмерный масштаб */
        .goal-value-muted {
            font-size: 9px;
            color: var(--text-muted);
            opacity: 0.5;
            line-height: 1;
            font-weight: 500;
        }

        /* Контейнер дат в шапке, идеально совпадающий с разделителем на карточках */
        .header-date-container {
            display: flex;
            justify-content: center;
            align-items: center;
            border-left: 1px solid rgba(29, 29, 29, 0.1); 
            padding-left: 12px;
            margin-left: 4px;
            height: 14px;
        }

        /* Сбалансированный и мягкий текст дат недели */
        .header-date-text {
            font-size: 10.5px;
            font-weight: 700; /* Сделали начертание чуть мягче */
            color: #555251; /* Благородный темно-серый, не спорящий с баджами */
            white-space: nowrap;
            letter-spacing: -0.01em;
        }

        .leaderboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            display: grid;
            /* Точно такая же сетка, как и у шапки */
            grid-template-columns: 20px 1fr 100px 180px;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .rank-number {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .rank-1 .rank-number { color: #B38E1B; }
        .rank-2 .rank-number { color: #7D7D7D; }
        .rank-3 .rank-number { color: #A67C52; }

        .user-name-wrapper {
            display: flex;
            align-items: center;
            flex-wrap: nowrap; /* Строгий запрет на перенос огонька */
            gap: 6px;
            min-width: 0;
            padding-right: 4px;
        }

        .user-name {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap; /* Запрет переноса длинных имен на новую строку */
        }

        /* Огонёк ударного режима */
        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 2.5px;
            font-size: 11px;
            font-weight: 700;
            color: var(--streak-fire);
            vertical-align: middle;
            user-select: none;
            flex-shrink: 0;
        }

        .streak-badge svg {
            flex-shrink: 0;
            fill: currentColor; /* Заливаем огонек цветом */
        }

        .streak-badge.inactive {
            color: var(--streak-inactive);
            opacity: 0.5;
        }

        .streak-badge.inactive svg {
            fill: none; /* Неактивный огонек делаем только контурным */
        }

        .rings-container {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
            justify-content: center; /* Центрируем квадраты внутри отведенной колонки */
            border-left: 1px solid var(--border); /* Тонкая разделительная линия */
            padding-left: 12px; /* Отступ от линии до квадратиков */
            height: 14px; /* Фиксированная высота разделителя для стройности */
            align-items: center;
            transition: all 0.2s ease;
        }

        .day-ring {
            width: 7px;
            height: 7px;
            border-radius: 1.5px;
            background-color: var(--accent-soft);
            transition: all 0.15s ease;
        }

        .day-ring.active { 
            background-color: var(--active-day); 
            box-shadow: 0 1px 2px rgba(217, 119, 87, 0.2); 
        }

        /* Объединенный контейнер прогресса для бесшовного примыкания */
        .progress-container-flex {
            display: flex;
            align-items: center;
            gap: 8px; /* Небольшой зазор между линией прогресса и текстом, как на макете */
            width: 100%;
            justify-content: flex-end;
            min-width: 0;
        }

        /* Классический тонкий прогресс-бар */
        .progress-mini {
            height: 2px;
            background: var(--accent-soft);
            border-radius: 1px;
            flex-grow: 1; /* Линия теперь заполняет все свободное пространство вплотную до цифр */
            overflow: hidden;
        }

        /* Фирменная шалфейная заливка */
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0;
            transition: width 1s ease-out;
        }

        .score-box { 
            text-align: right; 
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 3px;
            padding-right: 4px; /* Симметричный отступ в строках, соответствующий шапке */
        }
        .score-value { font-size: 13px; font-weight: 700; }
        .score-total { font-size: 10px; color: var(--text-muted); opacity: 0.6; }

        /* Увеличенная ширина контейнера для просторного премиального вида */
        .compact-container { max-width: 620px; margin: 0 auto; }

        /* Легенда */
        .table-footnote {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            gap: 12px;
        }

        .footnote-legend {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            display: inline-block;
        }

        .footnote-days-badge {
            display: flex;
            align-items: center;
            gap: 2px;
            background-color: rgba(229, 224, 216, 0.3);
            padding: 3px 6px;
            border-radius: 6px;
            border: 1px solid rgba(229, 224, 216, 0.6);
        }

        .footnote-days-label {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--text-muted);
            margin-right: 4px;
            opacity: 0.8;
        }

        .day-letter-box {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 700;
            border-radius: 3px;
            background-color: var(--bg-main);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        /* Инспектор дебага */
        .debug-panel {
            margin-top: 30px;
            background: #1e1e1e;
            color: #76c976;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        
        @media (max-width: 440px) {
            .leaderboard-header {
                grid-template-columns: 15px 1fr 80px 45px; 
                gap: 6px;
            }
            .leaderboard-card { 
                grid-template-columns: 15px 1fr 80px 45px; 
                gap: 6px;
            }
            .rings-container {
                padding-left: 8px;
                margin-left: 2px;
            }
            .progress-mini {
                display: none; // Скрываем шкалу на мобильных
            }
            .user-name { font-size: 12px; }
            .table-footnote { flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body class="py-5 px-3">

    <div class="compact-container">
        <!-- Шапка -->
        <div class="section-header">
            <span class="section-title">
                <i class="fa-solid fa-bolt"></i>
                <span>Трекер</span><strong>Активности</strong>
            </span>
        </div>

        <!-- Революционная панель-шапка таблицы -->
        <div class="leaderboard-header">
            <div></div> <!-- Ранг -->
            <div class="header-section-label">
                <i class="fa-regular fa-user text-[11px] text-gray-500"></i>
                <span>Участники</span>
                
                <!-- Восстановленный аккуратный классический бадж недели -->
                <div class="ml-2">
                    <span id="total-workouts-stat" class="header-stat-bubble" style="display: none;">
                        <i class="fa-solid fa-calendar-week text-[9px]"></i>
                        <span id="stat-combined-text">1 неделя</span>
                    </span>
                </div>
            </div>
            <!-- Дата диапазона недели, идеально центрированная над точками активности -->
            <div class="header-date-container">
                <!-- Мягкая иконка-якорь для визуального веса и баланса -->
                <i class="fa-regular fa-calendar text-[10px] text-[#555251] mr-1.5 opacity-90"></i>
                <span id="today-date" class="header-date-text">-</span>
            </div>
            <!-- Сплит-бадж цели недели (двойная пилюля) -->
            <div class="header-section-label justify-end">
                <div class="header-split-bubble" title="Спортивная цель на текущую неделю">
                    <span class="bubble-label">
                        <i class="fa-solid fa-arrow-trend-up text-[7.5px] opacity-80"></i>
                        <span>Цель</span>
                    </span>
                    <span class="bubble-value">
                        <i class="fa-solid fa-trophy text-[9px] text-amber-500 mr-0.5"></i>
                        <span class="goal-value-accent">5</span>
                        <span class="goal-value-muted">/7</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Контейнер карточек -->
        <div id="tracks-container" class="space-y-1">
            <div class="text-center py-10 text-gray-400 text-sm">
                <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Загрузка участников...
            </div>
        </div>

        <!-- Легенда -->
        <div class="table-footnote">
            <div class="footnote-legend">
                <span class="legend-item">
                    <span class="legend-dot" style="background-color: var(--active-day);"></span> Тренировка
                </span>
                <span class="legend-item">
                    <span class="legend-dot" style="background-color: var(--accent-soft);"></span> Отдых
                </span>
            </div>
            
            <div class="footnote-days-badge">
                <span class="footnote-days-label">Дни недели:</span>
                <div class="day-letter-box" style="background-color: var(--active-day); color: #ffffff; border-color: var(--active-day);">П</div>
                <div class="day-letter-box" style="background-color: var(--active-day); color: #ffffff; border-color: var(--active-day);">В</div>
                <div class="day-letter-box" style="background-color: var(--active-day); color: #ffffff; border-color: var(--active-day);">С</div>
                <div class="day-letter-box" style="background-color: var(--active-day); color: #ffffff; border-color: var(--active-day);">Ч</div>
                <div class="day-letter-box" style="background-color: var(--active-day); color: #ffffff; border-color: var(--active-day);">П</div>
                <div class="day-letter-box" style="background-color: var(--accent-soft); opacity: 0.9;">С</div>
                <div class="day-letter-box" style="background-color: var(--accent-soft); opacity: 0.9;">В</div>
            </div>
        </div>

        <!-- Ультра-минималистичный подвал с системным статусом и дебагом -->
        <div class="mt-8 text-center flex flex-col items-center gap-1">
            <div id="status" class="text-[9px] text-gray-400/60 inline-flex items-center gap-1.5 transition-all duration-300">
                <i class="fa-solid fa-circle-notch fa-spin text-[8px]"></i> Синхронизация...
            </div>
            <button onclick="toggleDebug()" class="text-[9px] uppercase tracking-wider text-gray-400/40 hover:text-gray-600 transition-all font-semibold mt-1">
                <i class="fa-solid fa-bug mr-1"></i> Инспектор данных (Debug)
            </button>
        </div>

        <!-- Скрытая панель дебага -->
        <div id="debug-panel" class="debug-panel hidden">
            <div class="font-bold border-b border-gray-700 pb-1 mb-2 text-white flex justify-between">
                <span>API RESPONSE INSPECTOR</span>
                <span class="text-gray-500 cursor-pointer" onclick="toggleDebug()">✕</span>
            </div>
            <pre id="debug-json">Ожидание загрузки данных...</pre>
        </div>
    </div>

    <script>
        // Глобальные настройки трекера
        const CONFIG = {
            // Дата официального начала фитнес-сезона (Понедельник, 11 мая 2026 года)
            SEASON_START_DATE: "2026-05-11",
            // Ссылка на деплой Google Apps Script
            SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxzPOszPmAKzvS51vSUAGombHUEW8ucgaB5kXp-YIerboC2EGMJcMJITP7LKO7Stb9D/exec"
        };

        let currentComputedWeek = 1; // Номер недели, рассчитываемый динамически

        function setWeeklyRange() {
            const dateEl = document.getElementById('today-date');
            
            // Настройка московского времени (UTC+3)
            const now = new Date();
            const moscowTime = new Date(now.getTime() + (3 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60000));
            
            const currentDayOfWeek = moscowTime.getDay(); // 0 - Вс, 1 - Пн, 2 - Вт и т.д.
            const currentHours = moscowTime.getHours();
            
            let startDate = new Date(moscowTime);
            let endDate = new Date(moscowTime);
            
            // Проверяем: сейчас ПОНЕДЕЛЬНИК до 19:00 по Москве?
            if (currentDayOfWeek === 1 && currentHours < 19) {
                // Если да, замораживаем прошлую календарную неделю (с Пн по Вс)
                endDate.setDate(moscowTime.getDate() - 1);
                startDate.setDate(moscowTime.getDate() - 7);
            } else {
                // Во все остальные дни и часы идет стандартное скользящее окно (последние 7 дней по сегодня включительно)
                endDate = moscowTime;
                startDate.setDate(endDate.getDate() - 6);
            }
            
            const monthNames = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
            
            const startDay = startDate.getDate();
            const startMonth = monthNames[startDate.getMonth()];
            const endDay = endDate.getDate();
            const endMonth = monthNames[endDate.getMonth()];
            
            // Форматируем диапазон дат и вставляем его прямо в шапку таблицы над активностями
            if (dateEl) {
                dateEl.textContent = startMonth === endMonth 
                    ? `${startDay} - ${endDay} ${startMonth}`
                    : `${startDay} ${startMonth} - ${endDay} ${endMonth}`;
            }

            // Вычисляем номер недели перед загрузкой статистики
            calculateCurrentWeek(moscowTime);
        }

        // Вычисление номера недели (фиксировано без склонений)
        function calculateCurrentWeek(currentTime) {
            const start = new Date(CONFIG.SEASON_START_DATE);
            start.setHours(0, 0, 0, 0);

            const today = new Date(currentTime);
            today.setHours(0, 0, 0, 0);

            const diffMs = today.getTime() - start.getTime();
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            
            if (diffDays >= 0) {
                currentComputedWeek = Math.floor(diffDays / 7) + 1;
            } else {
                currentComputedWeek = 1;
            }
        }

        async function fetchData() {
            const statusEl = document.getElementById('status');
            const debugJsonEl = document.getElementById('debug-json');
            setWeeklyRange();

            try {
                const response = await fetch(CONFIG.SCRIPT_URL);
                if (!response.ok) throw new Error("Сетевая ошибка запроса");
                
                const rawResult = await response.json();
                
                // Выводим полученный JSON в инспектор дебага
                debugJsonEl.textContent = JSON.stringify(rawResult, null, 2);
                
                // Проверяем структура ответа: { success: true, data: [...] }
                if (rawResult && rawResult.success && Array.isArray(rawResult.data)) {
                    render(rawResult.data);
                    calculateTeamStats(rawResult.data);
                    
                    // Ультра-приглушенный статус обновления в подвале
                    statusEl.innerHTML = '<i class="fa-solid fa-circle text-[5px] opacity-40"></i> Синхронизировано';
                } else {
                    console.warn("Неверная структура JSON, запуск ДЕМО режима");
                    statusEl.innerHTML = '<i class="fa-solid fa-circle text-[5px] text-amber-500/40"></i> Ошибка данных';
                    renderDemo();
                }
            } catch (error) {
                console.error("Ошибка при получении данных:", error);
                debugJsonEl.textContent = "Error loading from script: " + error.toString();
                statusEl.innerHTML = '<i class="fa-solid fa-circle text-[5px] text-amber-500/30"></i> Офлайн режим';
                renderDemo();
            }
        }

        // Вычисление и показ глобальной недельной статы
        function calculateTeamStats(participants) {
            const statBubble = document.getElementById('total-workouts-stat');
            const combinedTextEl = document.getElementById('stat-combined-text');
            if (statBubble && combinedTextEl) {
                // Всегда выводится жестко слово "неделя" без склонений
                combinedTextEl.textContent = `${currentComputedWeek} неделя`;
                statBubble.style.display = 'inline-flex';
            }
        }

        function render(participants) {
            const container = document.getElementById('tracks-container');
            if (!participants || !Array.isArray(participants) || participants.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">Данные не найдены</div>';
                return;
            }

            // Сортировка по общему количеству тренировок
            const sorted = participants
                .map(p => {
                    return {
                        ...p,
                        safeData: Array.isArray(p.data) ? p.data : [0,0,0,0,0,0,0],
                        total: Array.isArray(p.data) ? p.data.reduce((a, b) => a + b, 0) : 0,
                        streak: parseInt(p.streak, 10) || 0
                    };
                })
                .sort((a, b) => b.total - a.total);

            container.innerHTML = sorted.map((p, i) => {
                const rank = i + 1;
                const progressWidth = (p.total / 7) * 100;
                const rings = p.safeData.map(a => `<div class="day-ring ${a ? 'active' : ''}"></div>`).join('');
                
                const isInactive = p.streak === 0;
                
                // Верстка огонёчка с новым красивым и надежным SVG-вектором
                const streakHtml = `
                    <span class="streak-badge ${isInactive ? 'inactive' : ''}" title="Ударный режим: ${p.streak} нед.">
                        <svg width="12" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2c1.4 2.5 3 4.5 4.5 7 2.1 3.5 1.5 8-1.5 10.5a7 7 0 0 1-9 0c-3-2.5-3.6-7-1.5-10.5 1.5-2.5 3.1-4.5 4.5-7z"></path>
                        </svg>
                        <span>${p.streak}</span>
                    </span>`;
                
                return `
                    <div class="leaderboard-card rank-${rank}">
                        <div class="rank-number">${rank}</div>
                        <div class="user-name-wrapper">
                            <div class="user-name">${p.name}</div>
                            ${streakHtml}
                        </div>
                        <div class="rings-container">${rings}</div>
                        <!-- Объединенный контейнер прогресса: линия растягивается ровно до цифр -->
                        <div class="progress-container-flex">
                            <div class="progress-mini">
                                <div class="progress-fill" style="width: ${progressWidth}%"></div>
                            </div>
                            <div class="score-box">
                                <span class="score-value">${p.total}</span><span class="score-total">/7</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDemo() {
            const demoData = [
                { name: "Бодянчук Виталий (Демо)", data: [0, 1, 0, 1, 1, 1, 1], streak: 1 },
                { name: "Мурадян Акоп (Демо)", data: [0, 1, 1, 0, 1, 1, 1], streak: 5 },
                { name: "Халитов Михаил (Демо)", data: [0, 1, 1, 1, 1, 1, 1], streak: 2 },
                { name: "Волк-Леванович Илья (Демо)", data: [0, 1, 0, 1, 0, 1, 0], streak: 0 },
                { name: "Толстоноженко Александр (Демо)", data: [0, 1, 1, 0, 1, 0, 0], streak: 0 }
            ];
            render(demoData);
            calculateTeamStats(demoData);
        }

        function toggleDebug() {
            const panel = document.getElementById('debug-panel');
            panel.classList.toggle('hidden');
        }

        window.onload = fetchData;
    </script>
</body>
</html>
