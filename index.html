<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Квартал — Трекер</title>
    <!-- Inter — единственный шрифт который html2canvas корректно рендерит с кириллицей -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            /* ═══ БАЗОВАЯ ПАЛИТРА ═══ */
            --bg-page: #F5F1E9;
            --bg-shot: #FAF7F1;
            --card-bg: #FFFFFF;
            --card-bg-alt: #FCFAF5;
            --text-primary: #1A1A1A;
            --text-secondary: #5A5854;
            --text-tertiary: #8A8784;
            --border-soft: #EAE3D5;
            --border-medium: #D4CDBE;
            --neutral-bg: #EFE9DE;

            /* ═══ ОРАНЖЕВЫЙ (только для критических акцентов) ═══ */
            --accent-warm: #D97757;
            --accent-warm-soft: rgba(217, 119, 87, 0.10);
            --accent-warm-glow: rgba(217, 119, 87, 0.30);

            /* ═══ ШАЛФЕЙНАЯ СИСТЕМА — 3 ОТТЕНКА ═══ */
            /* По умолчанию: средний "quiet luxury" */
            --sage-bright: #708A74;
            --sage-soft: #8FA890;
            --sage-deep: #5C7060;
            
            /* Активный оттенок для тренировок — меняется через JS */
            --training-color: var(--sage-soft);
            --training-color-glow: rgba(143, 168, 144, 0.25);
            
            /* Acccent-cool для целей и системных элементов (всегда средний) */
            --accent-cool: #708A74;
            --accent-cool-soft: rgba(112, 138, 116, 0.10);

            /* ═══ ПРИГЛУШЁННЫЕ МЕДАЛИ ═══ */
            --rank-1: #B8A05D;  /* Матовое золото */
            --rank-2: #A8A8A4;  /* Графитовое серебро */
            --rank-3: #A88466;  /* Терракотовая бронза */
        }

        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-feature-settings: "tnum";
        }

        /* Явно прописываем Inter для зоны скриншота — html2canvas берёт computed font-family */
        .screenshot-zone, .screenshot-zone * {
            font-family: 'Inter', sans-serif !important;
        }

        /* ═══════════════════════════════════════════════
           ЗОНА СКРИНШОТА
           ═══════════════════════════════════════════════ */
        .screenshot-zone {
            background: var(--bg-shot);
            border-radius: 22px;
            padding: 20px 20px 18px 20px;
            max-width: 560px;
            margin: 0 auto;
            position: relative;
            box-shadow:
                0 1px 2px rgba(0,0,0,0.02),
                0 8px 32px -8px rgba(58, 51, 36, 0.08);
        }

        /* ═══ ШАПКА: бренд слева, крупный № справа ═══ */
        .shot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-soft);
        }

        .brand-block {
            display: flex;
            align-items: center;
        }

        .brand-title {
            font-size: 19px;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 7px;
            line-height: 1;
        }

        .brand-bolt {
            width: 18px;
            height: 18px;
            color: var(--accent-cool);
            flex-shrink: 0;
            opacity: 0.85;
        }

        .brand-light {
            font-weight: 400;
            color: var(--text-secondary);
        }

        .brand-bold {
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Дата под заголовком — выровнена по иконке молнии */
        .brand-date {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-left: 1px;
        }

        .brand-date-icon {
            width: 11px;
            height: 11px;
            color: var(--accent-warm);
            opacity: 0.8;
            flex-shrink: 0;
        }

        .brand-date span {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-tertiary);
            letter-spacing: -0.01em;
        }

        /* Правый блок шапки: просто номер недели */
        .week-display {
            display: flex;
            align-items: baseline;
            gap: 4px;
            line-height: 1;
        }

        .week-display-hash {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-tertiary);
            letter-spacing: -0.01em;
            line-height: 1;
        }

        .week-display-num {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 0.9;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
        }

        /* ═══ МЕТА-ПОЛОСА — чистая строка без фона ═══ */
        .meta-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0;
            padding: 12px 2px;
            border-bottom: 1px solid var(--border-soft);
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.005em;
            gap: 10px;
        }

        .meta-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .meta-icon {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
            opacity: 0.8;
        }

        .meta-item .meta-icon.calendar { color: var(--accent-warm); }
        .meta-item .meta-icon.target { color: var(--accent-cool); }

        .meta-divider-dot {
            width: 3px; height: 3px;
            background: var(--text-tertiary);
            border-radius: 50%;
            opacity: 0.35;
            flex-shrink: 0;
        }

        .meta-label {
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .meta-value-highlight {
            color: var(--accent-warm);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-right: 1px;
        }

        .meta-of {
            color: var(--text-tertiary);
            font-weight: 500;
            margin-right: 6px;
        }

        /* Точки цели — чуть крупнее */
        .goal-dots {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: 3px;
        }

        .goal-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--border-medium);
        }

        .goal-dot.filled {
            background: var(--accent-cool);
        }

        /* ═══ ЗАГОЛОВКИ КОЛОНОК ═══ */
        .column-headers {
            display: grid;
            grid-template-columns: 22px 1fr 114px 50px;
            gap: 8px;
            padding: 10px 10px 10px 10px;
        }

        .col-header-text {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            opacity: 0.7;
        }

        .col-header-rank { text-align: center; }
        .col-header-score { text-align: right; }

        .days-header-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            justify-items: center;
        }

        .day-letter-header {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-tertiary);
            letter-spacing: 0.04em;
            line-height: 1;
            opacity: 0.7;
        }

        .day-letter-header.weekend { opacity: 0.35; }

        /* В progress-режиме скрываем колонку дней в заголовке */
        .view-progress .column-headers {
            grid-template-columns: 22px 1fr 50px;
        }
        .view-progress .col-header-days-label { display: none; }
        .view-progress .col-header-progress { display: none; }

        /* ═══ КАРТОЧКИ УЧАСТНИКОВ ═══ */
        .card-list {
            display: flex;
            flex-direction: column;
        }

        .participant-card {
            display: grid;
            grid-template-columns: 22px 1fr 114px 50px;
            gap: 8px;
            align-items: center;
            padding: 7px 10px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-soft);
            border-radius: 0;
            min-height: 30px;
            transition: background 0.12s ease;
        }

        .participant-card:last-child {
            border-bottom: none;
        }

        .participant-card:hover {
            background: rgba(255,255,255,0.55);
        }

        .participant-card.row-even {
            background: transparent;
        }

        /* Ранг: приглушённые цвета медалей */
        .rank-num {
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            color: var(--text-tertiary);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .rank-1 .rank-num { color: var(--rank-1); font-size: 14px; }
        .rank-2 .rank-num { color: var(--rank-2); font-size: 14px; }
        .rank-3 .rank-num { color: var(--rank-3); font-size: 14px; }

        /* Имя и огонёк */
        .name-cell {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
            overflow: hidden;
        }

        .participant-name {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.015em;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex-shrink: 1;
            /* НЕ flex: 1 1 auto — имя занимает ровно столько, сколько нужно тексту */
        }

        /* Огонёк остаётся оранжевым — это семантически "горение" */
        .streak-inline {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 10.5px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
            line-height: 1;
        }

        .streak-inline.active { color: var(--accent-warm); }
        .streak-inline.inactive { color: var(--text-tertiary); opacity: 0.5; }

        /* ═══ ДНИ НЕДЕЛИ: ШАЛФЕЙНЫЕ КВАДРАТИКИ ═══ */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            justify-items: center;
            align-items: center;
        }

        .day-marker {
            width: 11px;
            height: 11px;
            border-radius: 3px;
            background: var(--border-soft);
            position: relative;
            transition: background 0.25s ease, box-shadow 0.25s ease;
        }

        /* ГЛАВНОЕ ИЗМЕНЕНИЕ: тренировки теперь шалфейные */
        .day-marker.active {
            background: var(--training-color);
            box-shadow:
                inset 0 0 0 1px rgba(0,0,0,0.04),
                0 1px 2px var(--training-color-glow);
        }

        .day-marker.weekend:not(.active) {
            background: transparent;
            border: 1px dashed var(--border-medium);
        }

        /* Счёт справа */
        .score-cell {
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            gap: 2px;
        }

        .score-main {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
        }

        .score-target {
            font-size: 9px;
            font-weight: 600;
            color: var(--text-tertiary);
            letter-spacing: 0.02em;
        }

        /* При выполнении цели — оранжевый остаётся (критический акцент успеха) */
        .score-main.goal-met { color: var(--accent-warm); }
        .score-target.goal-met { color: var(--training-color); }

        /* В progress-режиме: цвет score определяется через --score-intensity (0–1) */
        .view-progress .score-main {
            color: color-mix(in srgb, var(--text-primary) calc(var(--score-intensity, 1) * 100%), var(--border-medium));
        }
        .view-progress .score-main.goal-met {
            color: color-mix(in srgb, var(--text-primary) calc(var(--score-intensity, 1) * 100%), var(--border-medium));
        }
        .view-progress .score-target {
            color: color-mix(in srgb, var(--text-tertiary) calc(var(--score-intensity, 1) * 100%), var(--border-soft));
        }
        .view-progress .score-target.goal-met {
            color: color-mix(in srgb, var(--text-tertiary) calc(var(--score-intensity, 1) * 100%), var(--border-soft));
        }

        /* ═══ ФУТЕР ЗОНЫ СКРИНШОТА ═══ */
        .shot-footer {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-soft);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9px;
            color: var(--text-tertiary);
        }

        .footer-legend {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .legend-swatch {
            width: 8px; height: 8px;
            border-radius: 2px;
            transition: background 0.25s ease;
        }

        .swatch-active { background: var(--training-color); }
        .swatch-rest { background: var(--border-soft); }
        .swatch-weekend {
            background: transparent;
            border: 1px dashed var(--border-medium);
        }

        .footer-brand {
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            opacity: 0.7;
        }

        /* ═══════════════════════════════════════════════
           ВНЕ ЗОНЫ СКРИНШОТА — ADMIN TOOLS
           ═══════════════════════════════════════════════ */
        .admin-toolbar {
            max-width: 560px;
            margin: 14px auto 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
            flex-wrap: nowrap;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .week-nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px; height: 32px;
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .week-nav-btn:hover:not(:disabled) {
            border-color: var(--accent-warm);
            color: var(--accent-warm);
            transform: translateY(-1px);
        }

        .week-nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .week-nav-current {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            height: 32px;
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .week-nav-current button {
            background: none;
            border: none;
            padding: 0;
            font-size: 10px;
            font-weight: 600;
            color: var(--accent-cool);
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
            text-decoration-thickness: 1px;
            text-decoration-color: var(--accent-cool-soft);
        }

        .btn-png-export {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 0 14px;
            height: 32px;
            background: var(--accent-warm);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 8px -2px var(--accent-warm-glow);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-png-export:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px -2px var(--accent-warm-glow);
        }

        .btn-png-export:active { transform: translateY(0); }
        .btn-png-export svg { width: 13px; height: 13px; }
        .btn-png-export.loading { opacity: 0.7; pointer-events: none; }

        /* ═══ ПАНЕЛЬ НАСТРОЕК — тёмная admin-тема ═══ */
        .color-picker {
            max-width: 560px;
            margin: 12px auto 0 auto;
            padding: 12px 16px;
            background: #2A2825;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .color-picker-label {
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            flex-shrink: 0;
            min-width: 110px;
        }

        .color-options {
            display: flex;
            gap: 5px;
        }

        .color-option {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px 5px 7px;
            background: rgba(255,255,255,0.06);
            border: 1px solid transparent;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 10.5px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
        }

        .color-option:hover {
            background: rgba(255,255,255,0.10);
            color: rgba(255,255,255,0.75);
        }

        .color-option.active {
            border-color: rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.90);
        }

        .color-swatch-preview {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .swatch-preview-soft { background: #8FA890; }
        .swatch-preview-bright { background: #708A74; }
        .swatch-preview-deep { background: #5C7060; }

        /* Status bar */
        .status-bar {
            max-width: 560px;
            margin: 10px auto 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            font-size: 10px;
            color: var(--text-tertiary);
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-cool);
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-dot.pulse { animation: pulse-soft 1.8s ease-in-out infinite; }
        .status-dot.warn { background: #D89150; }
        .status-dot.error { background: #C25B5B; }

        .debug-toggle {
            background: none;
            border: none;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.15s;
        }

        .debug-toggle:hover { opacity: 1; }

        .debug-panel {
            max-width: 560px;
            margin: 12px auto 0 auto;
            background: #1A1F1E;
            color: #8FD89F;
            padding: 14px;
            border-radius: 12px;
            font-family: "SF Mono", Monaco, monospace;
            font-size: 10.5px;
            max-height: 280px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .debug-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2A302E;
            color: white;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .debug-close {
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 14px;
            background: none;
            border: none;
            padding: 0;
        }

        /* ═══ РЕДАКТИРУЕМЫЙ РЕЖИМ ═══ */
        .edit-mode .day-marker {
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .edit-mode .day-marker:hover { transform: scale(1.25); }
        .edit-mode .day-marker:active { transform: scale(0.95); }
        .edit-mode .progress-day-chip {
            cursor: pointer;
            transition: transform 0.1s ease, background 0.15s ease;
        }
        .edit-mode .progress-day-chip:hover { transform: scaleY(1.8); }
        .edit-mode .streak-inline {
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .edit-mode .streak-inline:hover { transform: scale(1.2); }
        .edit-mode .streak-inline:active { transform: scale(0.9); }

        /* Кнопка добавить огонёк (появляется при hover на name-cell если streak=0) */
        .streak-add-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px; height: 16px;
            border-radius: 4px;
            border: 1px dashed var(--border-medium);
            color: var(--text-tertiary);
            font-size: 10px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            flex-shrink: 0;
            transition: opacity 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;
            user-select: none;
        }
        .edit-mode .name-cell:hover .streak-add-btn { opacity: 1; }
        .streak-add-btn:hover {
            border-color: var(--accent-warm);
            color: var(--accent-warm);
            transform: scale(1.1);
        }

        /* Кнопки −/+ рядом с огоньком — только в edit-режиме */
        .streak-controls {
            display: none;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .edit-mode .streak-controls { display: inline-flex; }

        .streak-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px; height: 16px;
            border-radius: 4px;
            border: 1px solid var(--border-medium);
            background: var(--card-bg);
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            user-select: none;
            transition: all 0.12s ease;
            padding: 0;
            font-weight: 500;
        }

        .streak-btn:hover { background: var(--neutral-bg); border-color: var(--text-tertiary); color: var(--text-primary); transform: scale(1.15); }
        .streak-btn:active { transform: scale(0.9); }
        .streak-btn.minus:hover { border-color: #C25B5B; color: #C25B5B; background: rgba(194,91,91,0.06); }
        .streak-btn.plus:hover  { border-color: var(--accent-warm); color: var(--accent-warm); background: var(--accent-warm-soft); }

        @keyframes bump {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        .bumping { animation: bump 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* Грязная карточка — оранжевый левый бордер */
        .participant-card.dirty {
            background: rgba(217, 119, 87, 0.05) !important;
        }

        /* Тогл режима редактирования */
        .btn-edit-mode {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            height: 32px;
            background: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn-edit-mode svg { width: 13px; height: 13px; }
        .btn-edit-mode:hover { border-color: var(--accent-cool); color: var(--accent-cool); }
        .btn-edit-mode.active {
            background: var(--accent-cool);
            border-color: var(--accent-cool);
            color: white;
            box-shadow: 0 2px 8px -2px rgba(112, 138, 116, 0.35);
        }

        /* Кнопка сброса правок */
        .btn-reset-edits {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            height: 32px;
            background: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }
        .btn-reset-edits.visible { opacity: 1; pointer-events: auto; }
        .btn-reset-edits:hover { border-color: var(--accent-warm); color: var(--accent-warm); }
        .btn-reset-edits svg { width: 12px; height: 12px; }

        /* ═══ PROGRESS VIEW MODE ═══ */

        /* В progress-режиме days-grid скрыт, полоска через ::before на карточке */
        .progress-col { display: none; }
        .view-progress .days-grid { display: none !important; }
        .view-progress .participant-card,
        .view-progress .column-headers {
            grid-template-columns: 22px 1fr 50px;
        }

        /* Заголовки колонок */
        .col-header-progress { display: none; }
        .view-progress .col-header-days-label { display: none; }


        /* name-cell в progress-режиме: обычный горизонтальный flex (как в dots) */
        .view-progress .name-cell {
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        /* Бар-враппер скрыт в обоих режимах — полоска теперь через ::before на карточке */
        .progress-bar-wrap { display: none; }

        .view-progress .participant-card { min-height: 30px; }

        /* Вертикальная полоска слева — высота = прогресс через --p (0–1) */
        .view-progress .participant-card {
            position: relative;
            overflow: hidden; /* чтобы ::before не вылезал за border-radius */
        }

        .view-progress .participant-card::before { display: none; }

        .progress-bar-track { display: none; }
        .progress-bar-fill { display: none; }
        .progress-bar-goal-line { display: none; }

        .legend-progress-only { display: none; }
        .view-progress .legend-dots-only { display: none; }
        .view-progress .legend-progress-only { display: inline-flex; }

        /* Переключатель вида — тёмная тема */
        .view-toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 9px;
            margin-top: 9px;
            border-top: 1px solid rgba(255,255,255,0.07);
        }

        .view-toggle-label {
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            flex-shrink: 0;
            min-width: 110px;
        }

        .view-options {
            display: flex;
            gap: 5px;
        }

        .view-option {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 10px 5px 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid transparent;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 10.5px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
        }

        .view-option:hover {
            background: rgba(255,255,255,0.10);
            color: rgba(255,255,255,0.75);
        }

        .view-option.active {
            border-color: rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.90);
        }

        .icon-dots {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .icon-dots span {
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 1.5px;
            background: currentColor;
            opacity: 0.75;
        }

        .icon-bar {
            width: 28px; height: 5px;
            border-radius: 100px;
            background: rgba(255,255,255,0.15);
            position: relative;
            overflow: hidden;
            opacity: 0.9;
        }

        .icon-bar::after {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 65%;
            background: currentColor;
            border-radius: 100px;
        }

        /* Skeleton loader */
        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: 200px 0; }
        }

        .skeleton-card {
            height: 30px;
            background: linear-gradient(90deg, #F3EEE3 0%, #FAF7F1 50%, #F3EEE3 100%);
            background-size: 400px 100%;
            animation: shimmer 1.4s linear infinite;
            border-radius: 8px;
            border: 1px solid var(--border-soft);
        }

        /* PNG-export режим — скрываем служебные элементы не трогая layout зоны */
        body.exporting .admin-toolbar,
        body.exporting .status-bar,
        body.exporting .debug-panel,
        body.exporting .color-picker {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Скрываем интерактивные элементы внутри зоны при экспорте */
        body.exporting .streak-controls,
        body.exporting .streak-add-btn {
            display: none !important;
        }

        /* Адаптивность */
        @media (max-width: 520px) {
            body { padding-left: 10px; padding-right: 10px; }
            .screenshot-zone { padding: 16px 14px; border-radius: 18px; }
            .brand-title { font-size: 18px; }
            .week-display-num { font-size: 32px; }
            .meta-strip { padding: 8px 10px; gap: 8px; font-size: 10.5px; }
            .participant-card,
            .column-headers {
                grid-template-columns: 20px 1fr 96px 44px;
                gap: 6px;
            }
            .participant-card { padding: 5px 8px; min-height: 28px; }
            .participant-name { font-size: 11.5px; }
            .score-main { font-size: 13.5px; }
            .day-marker { width: 9px; height: 9px; }
            .footer-brand { display: none; }
            .color-picker { flex-wrap: wrap; }
            .color-options { width: 100%; }
        }
    </style>
</head>

    <script>
        // ═════════════════════════════════════════════════
        // КОНФИГУРАЦИЯ
        // ═════════════════════════════════════════════════
        const CONFIG = {
            SEASON_START_DATE: "2026-05-11",
            SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxzPOszPmAKzvS51vSUAGombHUEW8ucgaB5kXp-YIerboC2EGMJcMJITP7LKO7Stb9D/exec",
            TIMEZONE: "Europe/Moscow",
            GRACE_PERIOD: { dayOfWeek: 1, untilHour: 19 },
            MONTH_NAMES: ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'],
            WEEKLY_GOAL: 5,
            STORAGE_KEY: 'fk_sage_shade'
        };

        // Палитра шалфейных оттенков
        const SAGE_SHADES = {
            soft:   { color: '#8FA890', glow: 'rgba(143, 168, 144, 0.25)' },
            bright: { color: '#708A74', glow: 'rgba(112, 138, 116, 0.25)' },
            deep:   { color: '#5C7060', glow: 'rgba(92, 112, 96, 0.25)' }
        };

        const state = {
            currentWeek: 1,
            viewedWeek: 1,
            currentRange: { start: null, end: null },
            lastFetchData: null,
            sageShade: 'soft'  // дефолт по умолчанию
        };

        // ═════════════════════════════════════════════════
        // ПЕРЕКЛЮЧАТЕЛЬ ВИДА ТАБЛИЦЫ
        // ═════════════════════════════════════════════════
        const VIEW_KEY = 'fk_table_view';
        let currentView = 'dots';

        function applyView(view) {
            currentView = view;
            const zone = document.getElementById('screenshot-zone');
            const cardList = document.getElementById('card-list');

            if (view === 'progress') {
                zone.classList.add('view-progress');
                cardList.classList.add('view-progress');
            } else {
                zone.classList.remove('view-progress');
                cardList.classList.remove('view-progress');
            }

            document.querySelectorAll('.view-option').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });

            try { localStorage.setItem(VIEW_KEY, view); } catch(e) {}
        }

        function initViewToggle() {
            let saved = 'dots';
            try { const s = localStorage.getItem(VIEW_KEY); if (s) saved = s; } catch(e) {}
            applyView(saved);

            document.querySelectorAll('.view-option').forEach(btn => {
                btn.addEventListener('click', () => applyView(btn.dataset.view));
            });
        }
        // ═════════════════════════════════════════════════
        function applySageShade(shade) {
            const { color, glow } = SAGE_SHADES[shade];
            document.documentElement.style.setProperty('--training-color', color);
            document.documentElement.style.setProperty('--training-color-glow', glow);
            
            // Обновляем активную кнопку
            document.querySelectorAll('.color-option').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.shade === shade);
            });
            
            state.sageShade = shade;
            try {
                localStorage.setItem(CONFIG.STORAGE_KEY, shade);
            } catch(e) { /* localStorage недоступен — игнор */ }
        }

        function initSagePicker() {
            // Восстанавливаем сохранённый выбор
            let savedShade = 'soft';
            try {
                const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
                if (saved && SAGE_SHADES[saved]) savedShade = saved;
            } catch(e) {}
            
            applySageShade(savedShade);
            
            // Привязываем клики
            document.querySelectorAll('.color-option').forEach(btn => {
                btn.addEventListener('click', () => {
                    applySageShade(btn.dataset.shade);
                });
            });
        }

        // ═════════════════════════════════════════════════
        // ВРЕМЯ
        // ═════════════════════════════════════════════════
        function getMoscowDateParts() {
            const fmt = new Intl.DateTimeFormat('en-CA', {
                timeZone: CONFIG.TIMEZONE,
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', weekday: 'short',
                hour12: false
            });
            const parts = Object.fromEntries(
                fmt.formatToParts(new Date()).map(p => [p.type, p.value])
            );
            const weekdayMap = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
            return {
                year: +parts.year,
                month: +parts.month,
                day: +parts.day,
                hour: +parts.hour,
                weekday: weekdayMap[parts.weekday]
            };
        }

        function getMoscowMidnight() {
            const m = getMoscowDateParts();
            return new Date(Date.UTC(m.year, m.month - 1, m.day));
        }

        function addDays(date, days) {
            const d = new Date(date);
            d.setUTCDate(d.getUTCDate() + days);
            return d;
        }

        function getMondayOf(date) {
            const day = date.getUTCDay();
            const shift = day === 0 ? -6 : (1 - day);
            return addDays(date, shift);
        }

        function computeWeekRange(weekNumber) {
            const seasonStart = new Date(CONFIG.SEASON_START_DATE + "T00:00:00Z");
            const start = addDays(seasonStart, (weekNumber - 1) * 7);
            const end = addDays(start, 6);
            return { start, end };
        }

        function determineCurrentWeek() {
            const moscow = getMoscowDateParts();
            const moscowMidnight = getMoscowMidnight();
            let referenceWeek = getMondayOf(moscowMidnight);

            const isInGracePeriod =
                moscow.weekday === CONFIG.GRACE_PERIOD.dayOfWeek &&
                moscow.hour < CONFIG.GRACE_PERIOD.untilHour;

            if (isInGracePeriod) {
                referenceWeek = addDays(referenceWeek, -7);
            }

            const seasonStart = new Date(CONFIG.SEASON_START_DATE + "T00:00:00Z");
            const diffMs = referenceWeek.getTime() - seasonStart.getTime();
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const weekNum = Math.floor(diffDays / 7) + 1;
            const result = Math.max(1, weekNum);

            // Лог для отладки — видно в консоли браузера
            console.log('[Week Calc]', {
                moscowTime: `${moscow.year}-${moscow.month}-${moscow.day} ${moscow.hour}:00 (weekday=${moscow.weekday})`,
                gracePeriod: isInGracePeriod,
                referenceMonday: referenceWeek.toISOString().split('T')[0],
                seasonStart: seasonStart.toISOString().split('T')[0],
                diffDays,
                weekNum: result
            });

            return result;
        }

        function formatDateRange(start, end) {
            const sd = start.getUTCDate();
            const sm = start.getUTCMonth();
            const ed = end.getUTCDate();
            const em = end.getUTCMonth();
            const ey = end.getUTCFullYear();
            if (sm === em) return `${sd}–${ed} ${CONFIG.MONTH_NAMES[em]} ${ey}`;
            return `${sd} ${CONFIG.MONTH_NAMES[sm]} – ${ed} ${CONFIG.MONTH_NAMES[em]} ${ey}`;
        }

        // ═════════════════════════════════════════════════
        // РЕНДЕР
        // ═════════════════════════════════════════════════
        function updateWeekUI(weekNumber) {
            const { start, end } = computeWeekRange(weekNumber);
            state.currentRange = { start, end };

            document.getElementById('week-num-big').textContent = weekNumber;
            document.getElementById('date-range').textContent = formatDateRange(start, end);
            document.getElementById('nav-week-text').textContent = `Неделя ${weekNumber}`;
            document.getElementById('footer-date').textContent = `Неделя ${weekNumber} · ${formatDateRange(start, end)}`;

            document.getElementById('week-prev').disabled = weekNumber <= 1;
            document.getElementById('week-next').disabled = weekNumber >= state.currentWeek;
        }

        // ═════════════════════════════════════════════════
        // РЕАКТИВНАЯ МОДЕЛЬ ДАННЫХ
        // ═════════════════════════════════════════════════

        // editableState — единственный источник правды для текущего отображения.
        // originalState — слепок данных из API, используется для сброса правок.
        let editableState = [];
        let originalState = [];
        let isEditMode = false;
        let hasDirtyData = false;

        function cloneState(arr) {
            return arr.map(p => ({ ...p, data: [...p.data] }));
        }

        // ═════════════════════════════════════════════════
        // СОРТИРОВКА
        // 1. По total убывающий
        // 2. При равном total: сначала те у кого streak > 0, затем streak = 0
        // 3. Внутри каждой группы — по алфавиту (А→Я)
        // ═════════════════════════════════════════════════
        function sortParticipants(a, b) {
            if (b.total !== a.total) return b.total - a.total;
            const aHasStreak = a.streak > 0 ? 1 : 0;
            const bHasStreak = b.streak > 0 ? 1 : 0;
            if (bHasStreak !== aHasStreak) return bHasStreak - aHasStreak;
            return a.name.localeCompare(b.name, 'ru');
        }

        // Пересчёт total и пересортировка с сохранением DOM-позиций через FLIP
        function reorderAndRender() {
            // Пересчитываем total для каждого
            editableState.forEach(p => {
                p.total = p.data.reduce((a, b) => a + (b ? 1 : 0), 0);
            });

            // Сортируем: 1) по total убыв, 2) streak>0 перед streak=0, 3) по алфавиту внутри группы
            editableState.sort(sortParticipants);

            // Перерисовываем все карточки
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('card-list');
            container.innerHTML = editableState.map((p, i) => buildCardHTML(p, i)).join('');
            if (isEditMode) bindCardEvents();
        }

        // Строим HTML одной карточки
        function buildCardHTML(p, i) {
            const rank = i + 1;
            const isEven = i % 2 === 1;
            const goalMet = p.total >= CONFIG.WEEKLY_GOAL;
            // Бордер «грязной» карточки только пока активен edit-режим
            const isDirty = isEditMode && (p._dirty || false);

            const daysHtml = p.data.map((active, idx) => {
                const isWeekend = idx >= 5;
                const classes = ['day-marker', active ? 'active' : '', isWeekend ? 'weekend' : ''].filter(Boolean).join(' ');
                return `<div class="${classes}" data-pid="${p._id}" data-day="${idx}"></div>`;
            }).join('');

            // Огонёк — только если streak > 0, кнопки −/+ видны только в edit-режиме
            let streakHtml = '';
            if (p.streak > 0) {
                streakHtml = `
                    <span class="streak-inline active" title="Серия: ${p.streak} нед.">
                        <svg width="13" height="15" viewBox="0 0 13 15" fill="none">
                            <path d="M6.5 1C6.5 1 9 3.5 9 6c0 .8-.2 1.5-.6 2.1C8.8 7.4 9 6.7 9 6c0 0 1.5 1.5 1.5 3.5C10.5 12 8.7 14 6.5 14S2.5 12 2.5 9.5C2.5 7.2 4 5.5 4 5.5c0 1.2.6 2.2 1.5 2.8C5.1 7.4 5 6.7 5 6c0-2 1.5-5 1.5-5z" fill="currentColor" stroke="currentColor" stroke-width=".5" stroke-linejoin="round"/>
                            <path d="M6.5 9.5c0 1-.8 1.8-1.5 2 .2-.4.3-.8.3-1.2 0-.8-.5-1.5-.5-1.5s-.3.7-.3 1.5c0 .4.1.8.3 1.2-.7-.3-1.3-1-1.3-1.8 0-1.2 1.5-2.2 1.5-2.2s1.5 1 1.5 2z" fill="#FFF3CD" opacity=".7"/>
                        </svg>
                        <span class="streak-num">${p.streak}</span>
                    </span>
                    <span class="streak-controls">
                        <button class="streak-btn minus" data-pid="${p._id}" data-action="streak-minus" tabindex="-1">−</button>
                        <button class="streak-btn plus"  data-pid="${p._id}" data-action="streak-plus"  tabindex="-1">+</button>
                    </span>`;
            }

            // Кнопка «добавить огонёк» — если streak=0, только в edit-режиме при hover
            const addStreakHtml = (p.streak === 0)
                ? `<span class="streak-add-btn" data-pid="${p._id}" data-action="streak-add" title="Добавить серию">＋</span>`
                : '';

            const progressPct = Math.round((p.total / 7) * 100);
            const chipsHtml = p.data.map((active, idx) => {
                const isWeekend = idx >= 5;
                return `<span class="progress-day-chip ${active ? 'active' : ''} ${isWeekend ? 'weekend' : ''}" data-pid="${p._id}" data-day="${idx}"></span>`;
            }).join('');

            return `
                <div class="participant-card rank-${rank} ${isEven ? 'row-even' : ''} ${isDirty ? 'dirty' : ''}" data-pid="${p._id}" style="--p:${(p.total/7).toFixed(3)};--score-intensity:${Math.max(0.18, (p.total/7)).toFixed(3)}">
                    <div class="rank-num">${rank}</div>
                    <div class="name-cell">
                        <div style="display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;width:100%;">
                            <span class="participant-name" title="${p.name}">${p.name}</span>
                            ${streakHtml}
                            ${addStreakHtml}
                        </div>
                        <div class="progress-bar-wrap">
                            <div class="progress-bar-track">
                                <div class="progress-bar-fill" style="width:${progressPct}%"></div>
                                <div class="progress-bar-goal-line"></div>
                            </div>
                        </div>
                    </div>
                    <div class="days-grid">${daysHtml}</div>
                    <div class="score-cell">
                        <span class="score-main ${goalMet ? 'goal-met' : ''}">${p.total}</span><span class="score-target ${goalMet ? 'goal-met' : ''}">/7</span>
                    </div>
                </div>
            `;
        }

        function handleDayToggle(pid, dayIdx, el) {
            const p = editableState.find(x => x._id === pid);
            if (!p) return;
            p.data[dayIdx] = p.data[dayIdx] ? 0 : 1;
            p._dirty = true;
            hasDirtyData = true;
            if (el) {
                el.classList.remove('bumping');
                void el.offsetWidth;
                el.classList.add('bumping');
                el.addEventListener('animationend', () => el.classList.remove('bumping'), { once: true });
            }
            reorderAndRender();
            updateResetBtn();
        }

        // Привязка событий к карточкам в edit-режиме
        function bindCardEvents() {
            const container = document.getElementById('card-list');

            // Клики на квадратики дней (dots-режим)
            container.querySelectorAll('.day-marker[data-pid]').forEach(el => {
                el.addEventListener('click', () => handleDayToggle(el.dataset.pid, parseInt(el.dataset.day), el));
            });

            // Клики на чипы прогресс-режима (progress-режим)
            container.querySelectorAll('.progress-day-chip[data-pid]').forEach(el => {
                el.addEventListener('click', () => handleDayToggle(el.dataset.pid, parseInt(el.dataset.day), el));
            });

            // Огонёк + : прибавить streak
            container.querySelectorAll('[data-action="streak-plus"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const p = editableState.find(x => x._id === el.dataset.pid);
                    if (!p) return;
                    p.streak = Math.min(20, p.streak + 1);
                    p._dirty = true; hasDirtyData = true;
                    reorderAndRender(); updateResetBtn();
                });
            });

            // Огонёк − : убавить streak (при 0 огонёк исчезает)
            container.querySelectorAll('[data-action="streak-minus"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const p = editableState.find(x => x._id === el.dataset.pid);
                    if (!p) return;
                    p.streak = Math.max(0, p.streak - 1);
                    p._dirty = true; hasDirtyData = true;
                    reorderAndRender(); updateResetBtn();
                });
            });

            // Кнопка «добавить огонёк» — streak 0→1
            container.querySelectorAll('[data-action="streak-add"]').forEach(el => {
                el.addEventListener('click', () => {
                    const pid = el.dataset.pid;
                    const p = editableState.find(x => x._id === pid);
                    if (!p) return;

                    p.streak = 1;
                    p._dirty = true;
                    hasDirtyData = true;

                    reorderAndRender();
                    updateResetBtn();
                });
            });
        }

        // ═════════════════════════════════════════════════
        // РЕЖИМ РЕДАКТИРОВАНИЯ
        // ═════════════════════════════════════════════════
        function setEditMode(active) {
            isEditMode = active;
            const cardList = document.getElementById('card-list');
            const btn = document.getElementById('btn-edit-mode');
            const label = document.getElementById('edit-mode-label');

            if (active) {
                cardList.classList.add('edit-mode');
                btn.classList.add('active');
                label.textContent = 'Готово';
                bindCardEvents();
            } else {
                cardList.classList.remove('edit-mode');
                btn.classList.remove('active');
                label.textContent = 'Редактировать';
                // Перерисовываем без бордеров (isDirty теперь false т.к. isEditMode=false)
                renderCards();
            }
        }

        function updateResetBtn() {
            const btn = document.getElementById('btn-reset-edits');
            if (hasDirtyData) btn.classList.add('visible');
            else btn.classList.remove('visible');
        }

        function resetEdits() {
            editableState = cloneState(originalState);
            hasDirtyData = false;
            reorderAndRender();
            updateResetBtn();
        }

        document.getElementById('btn-edit-mode').addEventListener('click', () => {
            setEditMode(!isEditMode);
        });

        document.getElementById('btn-reset-edits').addEventListener('click', () => {
            resetEdits();
        });

        function renderParticipants(participants) {
            const container = document.getElementById('card-list');

            if (!participants || !Array.isArray(participants) || participants.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 30px 20px; color: var(--text-tertiary); font-size: 12px;">
                        Нет данных для этой недели
                    </div>`;
                return;
            }

            // Нормализуем и добавляем уникальный _id для отслеживания
            const normalized = participants.map((p, i) => ({
                ...p,
                _id: p.name.replace(/\s+/g, '_') + '_' + i,
                _dirty: false,
                data: Array.isArray(p.data) ? [...p.data] : [0,0,0,0,0,0,0],
                total: Array.isArray(p.data) ? p.data.reduce((a, b) => a + (b ? 1 : 0), 0) : 0,
                streak: parseInt(p.streak, 10) || 0
            }));

            // Сортируем: 1) по total убыв, 2) streak>0 перед streak=0, 3) по алфавиту внутри группы
            normalized.sort(sortParticipants);

            // Сохраняем в состояние
            originalState = cloneState(normalized);
            editableState = cloneState(normalized);
            hasDirtyData = false;
            updateResetBtn();

            renderCards();
        }

        function setStatus(type, text) {
            const indicator = document.getElementById('status-indicator');
            const dot = indicator.querySelector('.status-dot');
            const txt = document.getElementById('status-text');

            dot.className = 'status-dot';
            if (type === 'live') dot.style.background = 'var(--accent-cool)';
            else if (type === 'loading') dot.classList.add('pulse');
            else if (type === 'warn') dot.classList.add('warn');
            else if (type === 'error') dot.classList.add('error');
            txt.textContent = text;
        }

        // ═════════════════════════════════════════════════
        // ДАННЫЕ
        // ═════════════════════════════════════════════════
        async function fetchData(weekNumber) {
            setStatus('loading', `Загрузка данных недели ${weekNumber}...`);
            updateWeekUI(weekNumber);

            const debugEl = document.getElementById('debug-json');
            const { start, end } = computeWeekRange(weekNumber);

            // Диагностика — показываем что именно запрашиваем
            const diagHeader = [
                `▸ ЗАПРОС`,
                `  Неделя:    ${weekNumber}`,
                `  Диапазон:  ${formatDateRange(start, end)}`,
                `  URL:       ${CONFIG.SCRIPT_URL}?week=${weekNumber}`,
                `  МСК время: ${new Date().toLocaleString('ru-RU', { timeZone: CONFIG.TIMEZONE })}`,
                `  Grace:     ${getMoscowDateParts().weekday === CONFIG.GRACE_PERIOD.dayOfWeek && getMoscowDateParts().hour < CONFIG.GRACE_PERIOD.untilHour ? 'ДА (показываем прошлую неделю)' : 'нет'}`,
                ``,
                `▸ ОТВЕТ API`
            ].join('\n');

            debugEl.textContent = diagHeader + '\n  Загрузка...';

            try {
                const response = await fetch(`${CONFIG.SCRIPT_URL}?week=${weekNumber}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const result = await response.json();
                state.lastFetchData = result;
                debugEl.textContent = diagHeader + '\n' + JSON.stringify(result, null, 2);

                if (result && result.success && Array.isArray(result.data)) {
                    renderParticipants(result.data);
                    setStatus('live', `Обновлено · ${new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}`);
                } else {
                    renderDemo();
                    setStatus('warn', 'Демо-режим (структура данных невалидна)');
                }
            } catch (err) {
                console.error('Fetch error:', err);
                debugEl.textContent = diagHeader + '\n  Error: ' + err.toString();
                renderDemo();
                setStatus('warn', 'Демо-режим (нет связи с API)');
            }
        }

        function renderDemo() {
            const demoData = [
                { name: "Мурадян Акоп",            data: [1,1,1,0,1,1,1], streak: 5 },
                { name: "Халитов Михаил",          data: [1,1,1,1,1,1,0], streak: 2 },

        // ═════════════════════════════════════════════════
        // НАВИГАЦИЯ
        // ═════════════════════════════════════════════════
        function goToWeek(n) {
            const target = Math.max(1, Math.min(n, state.currentWeek));
            state.viewedWeek = target;
            // Сбрасываем режим редактирования при переходе на другую неделю
            if (isEditMode) setEditMode(false);
            fetchData(target);
        }

        document.getElementById('week-prev').addEventListener('click', () => goToWeek(state.viewedWeek - 1));
        document.getElementById('week-next').addEventListener('click', () => goToWeek(state.viewedWeek + 1));
        document.getElementById('nav-jump-current').addEventListener('click', () => goToWeek(state.currentWeek));

        // ═════════════════════════════════════════════════
        // PNG-ЭКСПОРТ
        // ═════════════════════════════════════════════════
        document.getElementById('btn-export-png').addEventListener('click', async () => {
            const btn = document.getElementById('btn-export-png');
            const zone = document.getElementById('screenshot-zone');
            const originalText = btn.querySelector('span').textContent;

            // Выходим из edit-режима
            if (isEditMode) setEditMode(false);

            // Запоминаем текущий вид и переключаемся в dots для экспорта
            const wasProgress = currentView === 'progress';
            if (wasProgress) applyView('dots');

            try {
                btn.classList.add('loading');
                btn.querySelector('span').textContent = 'Генерация...';
                document.body.classList.add('exporting');

                // Ждём загрузки шрифтов — критично для кириллицы в html2canvas
                await document.fonts.ready;
                await new Promise(r => setTimeout(r, 150));

                const canvas = await html2canvas(zone, {
                    backgroundColor: '#FAF7F1',
                    scale: 2,
                    logging: false,
                    useCORS: true,
                    allowTaint: false,
                    onclone: (clonedDoc) => {
                        const cl = clonedDoc.getElementById('card-list');
                        if (cl) cl.classList.remove('edit-mode');
                        clonedDoc.querySelectorAll('.dirty').forEach(el => el.classList.remove('dirty'));
                        clonedDoc.querySelectorAll('.streak-controls').forEach(el => el.style.display = 'none');
                        clonedDoc.querySelectorAll('.streak-add-btn').forEach(el => el.style.display = 'none');
                    }
                });

                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const weekStr = String(state.viewedWeek).padStart(2, '0');
                    a.href = url;
                    a.download = `fitness-kvartal-week-${weekStr}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 'image/png');

            } catch (err) {
                console.error('Export error:', err);
                alert('Ошибка при экспорте: ' + err.message);
            } finally {
                document.body.classList.remove('exporting');
                btn.classList.remove('loading');
                btn.querySelector('span').textContent = originalText;
                // Возвращаем предыдущий вид
                if (wasProgress) applyView('progress');
            }
        });

        function toggleDebug() {
            const panel = document.getElementById('debug-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        // ═════════════════════════════════════════════════
        // АВТО-ОБНОВЛЕНИЕ НЕДЕЛИ
        // Если страница открыта давно (через полночь или 19:00 пн),
        // currentWeek пересчитывается и данные перезагружаются
        // ═════════════════════════════════════════════════
        function watchWeek() {
            setInterval(() => {
                const newWeek = determineCurrentWeek();
                // Если текущая неделя изменилась И пользователь смотрит на «текущую» неделю
                if (newWeek !== state.currentWeek && state.viewedWeek === state.currentWeek) {
                    state.currentWeek = newWeek;
                    state.viewedWeek = newWeek;
                    fetchData(newWeek);
                } else if (newWeek !== state.currentWeek) {
                    // Просто обновляем currentWeek чтобы кнопка → разблокировалась
                    state.currentWeek = newWeek;
                    document.getElementById('week-next').disabled = state.viewedWeek >= state.currentWeek;
                }
            }, 60 * 1000); // проверяем каждую минуту
        }
        // ═════════════════════════════════════════════════
        window.addEventListener('load', () => {
            initSagePicker();
            initViewToggle();
            state.currentWeek = determineCurrentWeek();
            state.viewedWeek = state.currentWeek;
            fetchData(state.viewedWeek);
            watchWeek();
        });
    </script>
</body>
