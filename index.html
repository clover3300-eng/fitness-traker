<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Quarter - Live Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-main: #F9F6F1; 
            --card-bg: #ffffff; 
            --text-main: #1D1D1D;
            --text-muted: #666362;
            --accent: #708A74; 
            --accent-soft: #E8E2D9;
            --border: #E5E0D8;
            --active-day: #D97757; 
            --status-ok: #16A34A; 
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .section-header {
            margin-bottom: 20px;
            padding: 0 4px 12px 4px;
            border-bottom: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .section-title {
            font-size: 15px;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title i { font-size: 12px; color: var(--active-day); }

        .status-text {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--active-day);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .date-badge {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            padding: 2.5px 8px;
            background: var(--accent-soft);
            border-radius: 100px;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .anim-pulse { animation: pulse 1.5s infinite; }

        .leaderboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            display: grid;
            grid-template-columns: 20px 1fr 75px 40px auto;
            align-items: center;
            gap: 12px;
        }

        .user-name-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            color: var(--active-day);
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
            background: rgba(217, 119, 87, 0.1);
            padding: 1px 4px;
            border-radius: 4px;
        }

        .flame-icon {
            animation: flameFlicker 1s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        @keyframes flameFlicker {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .rings-container { display: flex; gap: 3px; justify-content: flex-end; }
        .day-ring {
            width: 7px;
            height: 7px;
            border-radius: 1.5px;
            background-color: var(--accent-soft);
        }
        .day-ring.active { background-color: var(--active-day); }

        .score-box { text-align: right; min-width: 35px; }
        .score-value { font-size: 13px; font-weight: 700; color: var(--accent); }

        .compact-container { max-width: 500px; margin: 0 auto; }

        .table-footnote {
            margin-top: 20px;
            padding: 12px 4px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
        }

        .day-letter-box {
            width: 14px; height: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 8px; font-weight: 700; border-radius: 3px;
            background-color: var(--accent-soft);
        }
    </style>
</head>
<body class="py-5 px-3">

    <div class="compact-container">
        <div class="section-header">
            <span class="section-title">
                <i class="fa-solid fa-bolt"></i>
                <span>Лидеры</span> <strong>Fitness Quarter</strong>
            </span>
            <div class="info-group flex items-center gap-3">
                <span id="status" class="status-text anim-pulse">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Загрузка
                </span>
            </div>
        </div>

        <div id="tracks-container" class="space-y-2">
            <!-- Сюда попадут данные -->
        </div>

        <div class="table-footnote">
            <div class="flex gap-3">
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-[var(--active-day)]"></span> Активен</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-[var(--accent-soft)]"></span> Отдых</span>
            </div>
            <div class="flex gap-1">
                <div class="day-letter-box" style="background:var(--active-day); color:white">П</div>
                <div class="day-letter-box" style="background:var(--active-day); color:white">В</div>
                <div class="day-letter-box" style="background:var(--active-day); color:white">С</div>
                <div class="day-letter-box" style="background:var(--active-day); color:white">Ч</div>
                <div class="day-letter-box" style="background:var(--active-day); color:white">П</div>
                <div class="day-letter-box">С</div>
                <div class="day-letter-box">В</div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzPOszPmAKzvS51vSUAGombHUEW8ucgaB5kXp-YIerboC2EGMJcMJITP7LKO7Stb9D/exec"; 

        // ТЕСТОВЫЕ ДАННЫЕ ДЛЯ ПРЕДПРОСМОТРА (на случай если Fetch блокируется)
        const DEMO_DATA = [
            { name: "Александр В.", streak: 5, data: [1, 1, 1, 1, 1, 0, 0] },
            { name: "Мария С.", streak: 12, data: [1, 1, 0, 1, 1, 1, 0] },
            { name: "Дмитрий К.", streak: 0, data: [1, 0, 1, 0, 1, 0, 0] },
            { name: "Елена П.", streak: 3, data: [0, 1, 1, 1, 0, 0, 0] }
        ];

        async function fetchData() {
            const statusEl = document.getElementById('status');
            try {
                // Ставим таймаут на запрос, чтобы не ждать вечно в предпросмотре
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), 3000);

                const response = await fetch(SCRIPT_URL, { signal: controller.signal });
                clearTimeout(id);
                
                const data = await response.json();
                render(data);
                
                statusEl.innerHTML = '<i class="fa-solid fa-check"></i> Live';
                statusEl.style.color = "var(--status-ok)";
            } catch (e) {
                console.warn("Используются демо-данные (запрос заблокирован или таймаут)");
                render(DEMO_DATA);
                statusEl.innerHTML = '<i class="fa-solid fa-eye"></i> Demo Mode';
                statusEl.style.color = "var(--text-muted)";
            }
            statusEl.classList.remove('anim-pulse');
        }

        function render(participants) {
            const container = document.getElementById('tracks-container');
            
            const processed = participants.map(p => {
                const s = Number(p.streak || p.Streak || 0);
                const activeDays = Array.isArray(p.data) ? p.data.reduce((a, b) => a + b, 0) : 0;
                return { ...p, streak: s, total: activeDays };
            }).sort((a, b) => b.total - a.total || b.streak - a.streak);

            container.innerHTML = processed.map((p, i) => {
                const rings = (p.data || [0,0,0,0,0,0,0]).map(a => `<div class="day-ring ${a ? 'active' : ''}"></div>`).join('');
                
                // Огонек
                const streakHtml = (p.streak > 0) 
                    ? `<span class="streak-badge">
                        <i class="fa-solid fa-fire-flame-curved flame-icon"></i>
                        ${p.streak}
                       </span>` 
                    : '';

                return `
                    <div class="leaderboard-card">
                        <div class="text-[10px] font-bold opacity-30">${i + 1}</div>
                        <div class="user-name-wrapper">
                            <div class="user-name">${p.name}</div>
                            ${streakHtml}
                        </div>
                        <div class="rings-container">${rings}</div>
                        <div class="score-box">
                            <span class="score-value">${p.total}</span><span class="text-[9px] opacity-40 ml-0.5">/7</span>
                        </div>
                        <div class="text-[14px] text-[var(--accent)] opacity-40">
                            <i class="fa-solid fa-chevron-right"></i>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.onload = fetchData;
    </script>
</body>
</html>
