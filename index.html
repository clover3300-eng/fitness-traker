<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Quarter - Live Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-main: #F9F6F1; 
            --card-bg: #ffffff; 
            --text-main: #1D1D1D;
            --text-muted: #666362;
            --accent: #D97757; 
            --accent-soft: #E8E2D9;
            --border: #E5E0D8;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .section-header {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 16px;
            padding: 0 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .section-title {
            white-space: nowrap;
        }

        .info-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .status-text {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: var(--accent);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .date-badge {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: var(--accent-soft);
            border-radius: 100px;
            white-space: nowrap;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .anim-pulse { animation: pulse 1.5s infinite; }

        .leaderboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            display: grid;
            grid-template-columns: 20px 130px 75px 1fr auto;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .rank-number {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .rank-1 .rank-number { color: #B38E1B; }
        .rank-2 .rank-number { color: #7D7D7D; }
        .rank-3 .rank-number { color: #A67C52; }

        .user-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rings-container {
            display: flex;
            gap: 3px;
        }

        .day-ring {
            width: 7px;
            height: 7px;
            border-radius: 1.5px;
            background-color: var(--accent-soft);
        }

        .day-ring.active { background-color: var(--accent); }

        .progress-mini {
            height: 2px;
            background: var(--accent-soft);
            border-radius: 1px;
            width: 100%;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0;
            transition: width 1s ease-out;
        }

        .score-box { text-align: right; }
        .score-value { font-size: 13px; font-weight: 700; }
        .score-total { font-size: 10px; color: var(--text-muted); opacity: 0.6; }

        .compact-container { max-width: 520px; margin: 0 auto; }
        
        @media (max-width: 420px) {
            .leaderboard-card { grid-template-columns: 15px 110px 70px 1fr auto; }
            .section-header { font-size: 11px; }
        }
    </style>
</head>
<body class="py-5 px-3">

    <div class="compact-container">
        <div class="section-header">
            <span class="section-title">Еженедельный мониторинг активности</span>
            <div class="info-group">
                <span id="status" class="status-text anim-pulse">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Обновление
                </span>
                <div id="today-date" class="date-badge">
                    <!-- Дата вставится сюда -->
                </div>
            </div>
        </div>

        <div id="tracks-container" class="space-y-1">
            <!-- Данные подгрузятся сюда -->
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzPOszPmAKzvS51vSUAGombHUEW8ucgaB5kXp-YIerboC2EGMJcMJITP7LKO7Stb9D/exec"; 

        function setTodayDate() {
            const dateEl = document.getElementById('today-date');
            const now = new Date();
            // Московское время
            const moscowTime = new Date(now.getTime() + (3 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60000));
            
            const day = moscowTime.getDate();
            const monthNames = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
            const month = monthNames[moscowTime.getMonth()];
            
            dateEl.innerHTML = `<i class="fa-regular fa-calendar"></i> ${day} ${month}`;
        }

        async function fetchData() {
            const statusEl = document.getElementById('status');
            setTodayDate();

            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error("Network error");
                
                const data = await response.json();
                
                if (data.error) {
                    statusEl.innerHTML = '<i class="fa-solid fa-exclamation-circle"></i> Ошибка';
                    renderDemo();
                    return;
                }

                render(data);
                statusEl.innerHTML = '<i class="fa-solid fa-check"></i> Обновлено';
                statusEl.classList.remove('anim-pulse');
                statusEl.style.color = "#16A34A"; 
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                statusEl.innerHTML = '<i class="fa-solid fa-plug-circle-xmark"></i> Офлайн';
                renderDemo();
            }
        }

        function render(participants) {
            const container = document.getElementById('tracks-container');
            if (!participants || !Array.isArray(participants) || participants.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">Данные не найдены</div>';
                return;
            }

            const sorted = participants
                .map(p => ({
                    ...p,
                    safeData: Array.isArray(p.data) ? p.data : [0,0,0,0,0,0,0],
                    total: Array.isArray(p.data) ? p.data.reduce((a, b) => a + b, 0) : 0
                }))
                .sort((a, b) => b.total - a.total);

            container.innerHTML = sorted.map((p, i) => {
                const rank = i + 1;
                const progressWidth = (p.total / 7) * 100;
                const rings = p.safeData.map(a => `<div class="day-ring ${a ? 'active' : ''}"></div>`).join('');
                
                return `
                    <div class="leaderboard-card rank-${rank}">
                        <div class="rank-number">${rank}</div>
                        <div class="user-name">${p.name}</div>
                        <div class="rings-container">${rings}</div>
                        <div class="progress-mini">
                            <div class="progress-fill" style="width: ${progressWidth}%"></div>
                        </div>
                        <div class="score-box">
                            <span class="score-value">${p.total}</span><span class="score-total">/7</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDemo() {
            const demoData = [{ name: "Ожидание данных...", data: [0, 0, 0, 0, 0, 0, 0] }];
            render(demoData);
        }

        window.onload = fetchData;
    </script>
</body>
</html>
