<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Quarter - Live Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            /* Палитра Anthropic / Claude с измененными акцентами */
            --bg-main: #F9F6F1; 
            --card-bg: #ffffff; 
            --text-main: #1D1D1D;
            --text-muted: #666362;
            --accent: #708A74; /* Элегантный шалфейно-зеленый для линии прогресса */
            --accent-soft: #E8E2D9;
            --border: #E5E0D8;
            --active-day: #D97757; /* Яркий терракотовый для выполненных дней (огоньки активности) */
            --status-ok: #16A34A; /* Зеленый для успешного обновления */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .section-header {
            margin-bottom: 20px;
            padding: 0 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        /* Дизайн главного заголовка в стиле Anthropic */
        .section-title {
            font-size: 15px;
            letter-spacing: -0.01em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .section-title i {
            font-size: 12px;
            color: var(--active-day);
            opacity: 0.9;
        }

        .section-title span {
            font-weight: 400;
            color: var(--text-muted);
        }

        .section-title strong {
            font-weight: 700;
            color: var(--text-main);
        }

        .info-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .status-text {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--active-day); /* Используем терракотовый для статуса обновления */
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .date-badge {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2.5px 8px;
            background: var(--accent-soft);
            border-radius: 100px;
            white-space: nowrap;
            letter-spacing: -0.01em;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .anim-pulse { animation: pulse 1.5s infinite; }

        .leaderboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            display: grid;
            /* Сетка: Ранг (фиксир) | Имя (фиксир) | Квадраты (фиксир) | Линия (гибкая) | Счет (авто) */
            grid-template-columns: 20px 190px 75px 1fr auto;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .rank-number {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .rank-1 .rank-number { color: #B38E1B; }
        .rank-2 .rank-number { color: #7D7D7D; }
        .rank-3 .rank-number { color: #A67C52; }

        .user-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rings-container {
            display: flex;
            gap: 3px;
        }

        .day-ring {
            width: 7px;
            height: 7px;
            border-radius: 1.5px;
            background-color: var(--accent-soft);
        }

        .day-ring.active { 
            background-color: var(--active-day); 
            box-shadow: 0 1px 2px rgba(217, 119, 87, 0.2); /* Легкое терракотовое свечение */
        }

        .progress-mini {
            height: 2px;
            background: var(--accent-soft);
            border-radius: 1px;
            width: 100%;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0;
            transition: width 1s ease-out;
        }

        .score-box { text-align: right; }
        .score-value { font-size: 13px; font-weight: 700; }
        .score-total { font-size: 10px; color: var(--text-muted); opacity: 0.6; }

        .compact-container { max-width: 520px; margin: 0 auto; }

        /* Стильный компактный футер-сноска */
        .table-footnote {
            margin-top: 16px;
            padding: 10px 4px 0 4px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
        }

        .footnote-days {
            display: flex;
            gap: 5px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .footnote-legend {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 6px;
            height: 6px;
            border-radius: 1px;
        }
        
        @media (max-width: 440px) {
            .leaderboard-card { 
                /* На мобильных выделяем 150px под имя, чтобы всё аккуратно помещалось на узком экране */
                grid-template-columns: 15px 150px 70px 1fr auto; 
                gap: 6px;
            }
            .user-name {
                font-size: 12px; /* Слегка уменьшаем шрифт на смартфонах для гарантированного входа */
            }
            .section-header { 
                align-items: center;
            }
            .section-title {
                font-size: 13px;
            }
            .table-footnote {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body class="py-5 px-3">

    <div class="compact-container">
        <div class="section-header">
            <span class="section-title">
                <i class="fa-solid fa-bolt"></i>
                <span>Трекер</span><strong>Активности</strong>
            </span>
            <div class="info-group">
                <span id="status" class="status-text anim-pulse">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Обновление
                </span>
                <div id="today-date" class="date-badge">
                    <!-- Диапазон дат вставится сюда -->
                </div>
            </div>
        </div>

        <div id="tracks-container" class="space-y-1">
            <!-- Данные подгрузятся сюда -->
        </div>

        <!-- Сноска с расшифровкой дней недели и цветов -->
        <div class="table-footnote">
            <div class="footnote-legend">
                <span class="legend-item">
                    <span class="legend-dot" style="background-color: var(--active-day);"></span> Тренировка
                </span>
                <span class="legend-item">
                    <span class="legend-dot" style="background-color: var(--accent-soft);"></span> Отдых
                </span>
            </div>
            <div class="footnote-days">
                <span>ПН</span>•<span>ВТ</span>•<span>СР</span>•<span>ЧТ</span>•<span>ПТ</span>•<span>СБ</span>•<span>ВС</span>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzPOszPmAKzvS51vSUAGombHUEW8ucgaB5kXp-YIerboC2EGMJcMJITP7LKO7Stb9D/exec"; 

        function setWeeklyRange() {
            const dateEl = document.getElementById('today-date');
            const now = new Date();
            // Настройка московского времени (UTC+3)
            const moscowTime = new Date(now.getTime() + (3 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60000));
            
            // Находим "Вчера" (конечная дата нашего 7-дневного окна)
            const endDate = new Date(moscowTime);
            endDate.setDate(moscowTime.getDate() - 1);
            
            // Находим стартовую дату (6 дней назад от вчера — суммарно 7 дней)
            const startDate = new Date(endDate);
            startDate.setDate(endDate.getDate() - 6);
            
            const monthNames = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
            
            const startDay = startDate.getDate();
            const startMonth = monthNames[startDate.getMonth()];
            const endDay = endDate.getDate();
            const endMonth = monthNames[endDate.getMonth()];
            
            // Форматируем вывод: "11 - 17 мая" или "29 апр - 5 мая" (если неделя переходящая)
            const dateString = startMonth === endMonth 
                ? `${startDay} - ${endDay} ${startMonth}`
                : `${startDay} ${startMonth} - ${endDay} ${endMonth}`;
                
            dateEl.innerHTML = `<i class="fa-regular fa-calendar"></i> ${dateString}`;
        }

        async function fetchData() {
            const statusEl = document.getElementById('status');
            setWeeklyRange();

            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error("Network error");
                
                const data = await response.json();
                
                if (data.error) {
                    statusEl.innerHTML = '<i class="fa-solid fa-exclamation-circle"></i> Ошибка';
                    renderDemo();
                    return;
                }

                render(data);
                statusEl.innerHTML = '<i class="fa-solid fa-check"></i> Обновлено';
                statusEl.classList.remove('anim-pulse');
                statusEl.style.color = "var(--status-ok)"; 
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                statusEl.innerHTML = '<i class="fa-solid fa-plug-circle-xmark"></i> Офлайн';
                renderDemo();
            }
        }

        function render(participants) {
            const container = document.getElementById('tracks-container');
            if (!participants || !Array.isArray(participants) || participants.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">Данные не найдены</div>';
                return;
            }

            const sorted = participants
                .map(p => ({
                    ...p,
                    safeData: Array.isArray(p.data) ? p.data : [0,0,0,0,0,0,0],
                    total: Array.isArray(p.data) ? p.data.reduce((a, b) => a + b, 0) : 0
                }))
                .sort((a, b) => b.total - a.total);

            container.innerHTML = sorted.map((p, i) => {
                const rank = i + 1;
                const progressWidth = (p.total / 7) * 100;
                const rings = p.safeData.map(a => `<div class="day-ring ${a ? 'active' : ''}"></div>`).join('');
                
                return `
                    <div class="leaderboard-card rank-${rank}">
                        <div class="rank-number">${rank}</div>
                        <div class="user-name">${p.name}</div>
                        <div class="rings-container">${rings}</div>
                        <div class="progress-mini">
                            <div class="progress-fill" style="width: ${progressWidth}%"></div>
                        </div>
                        <div class="score-box">
                            <span class="score-value">${p.total}</span><span class="score-total">/7</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDemo() {
            const demoData = [{ name: "Ожидание данных...", data: [0, 0, 0, 0, 0, 0, 0] }];
            render(demoData);
        }

        window.onload = fetchData;
    </script>
</body>
</html>
