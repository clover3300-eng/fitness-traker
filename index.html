<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Quarter - Live Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #F9F6F1; 
            --card-bg: #ffffff; 
            --text-main: #1D1D1D;
            --text-muted: #666362;
            --accent: #708A74; 
            --accent-soft: #E8E2D9;
            --border: #E5E0D8;
            --active-day: #D97757; 
            --status-ok: #16A34A;
            --streak-fire: #FF5A1F; 
            --streak-inactive: #C4C2BC;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .section-header {
            margin-bottom: 20px;
            padding: 0 4px 12px 4px;
            border-bottom: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .section-title {
            font-size: 15px;
            letter-spacing: -0.01em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .section-title i {
            font-size: 12px;
            color: var(--active-day);
            opacity: 0.9;
        }

        .section-title span { font-weight: 400; color: var(--text-muted); }
        .section-title strong { font-weight: 700; color: var(--text-main); }

        .info-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .status-text {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--active-day);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .date-badge {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2.5px 8px;
            background: var(--accent-soft);
            border-radius: 100px;
            white-space: nowrap;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .anim-pulse { animation: pulse 1.5s infinite; }

        .leaderboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            display: grid;
            grid-template-columns: 20px minmax(110px, 1.5fr) 75px 1fr auto;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .rank-number {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .rank-1 .rank-number { color: #B38E1B; }
        .rank-2 .rank-number { color: #7D7D7D; }
        .rank-3 .rank-number { color: #A67C52; }

        .user-name-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex-wrap: wrap; 
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            white-space: normal;
            word-break: keep-all; 
            overflow: visible;
        }

        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 800;
            color: var(--streak-fire);
            background-color: rgba(255, 90, 31, 0.08);
            border: 1px solid rgba(255, 90, 31, 0.25);
            padding: 2px 6px;
            border-radius: 6px;
            vertical-align: middle;
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .streak-badge svg {
            flex-shrink: 0;
            filter: drop-shadow(0 1px 1px rgba(255, 90, 31, 0.2));
        }

        .streak-badge:hover {
            transform: scale(1.05);
            background-color: rgba(255, 90, 31, 0.15);
        }

        .streak-badge.inactive {
            color: var(--streak-inactive);
            background-color: rgba(196, 194, 188, 0.08);
            border-color: rgba(196, 194, 188, 0.2);
            opacity: .45;
            cursor: default;
        }

        .streak-badge.inactive:hover {
            transform: none;
        }

        .rings-container {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
        }

        .day-ring {
            width: 7px;
            height: 7px;
            border-radius: 1.5px;
            background-color: var(--accent-soft);
        }

        .day-ring.active { 
            background-color: var(--active-day); 
            box-shadow: 0 1px 2px rgba(217, 119, 87, 0.2); 
        }

        .progress-mini {
            height: 2px;
            background: var(--accent-soft);
            border-radius: 1px;
            width: 100%;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0;
            transition: width 1s ease-out;
        }

        .score-box { 
            text-align: right; 
            flex-shrink: 0;
        }
        
        .score-value { font-size: 13px; font-weight: 700; }
        .score-total { font-size: 10px; color: var(--text-muted); opacity: 0.6; }

        .compact-container { max-width: 520px; margin: 0 auto; }

        .table-footnote {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            gap: 12px;
        }

        .footnote-legend {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            display: inline-block;
        }

        .footnote-days-badge {
            display: flex;
            align-items: center;
            gap: 2px;
            background-color: rgba(229, 224, 216, 0.3);
            padding: 3px 6px;
            border-radius: 6px;
            border: 1px solid rgba(229, 224, 216, 0.6);
        }

        .footnote-days-label {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--text-muted);
            margin-right: 4px;
            opacity: 0.8;
        }

        .day-letter-box {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 700;
            border-radius: 3px;
            background-color: var(--bg-main);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .debug-panel {
            margin-top: 24px;
            border-radius: 6px;
            background-color: #21201E;
            color: #E6E4E0;
            font-family: monospace;
            font-size: 11px;
            overflow: hidden;
            border: 1px solid #363430;
        }

        .debug-header {
            background-color: #2E2D2A;
            padding: 6px 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .debug-content {
            padding: 10px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }
        
        @media (max-width: 440px) {
            .leaderboard-card { 
                grid-template-columns: 18px minmax(0, 1fr) 70px auto; 
                gap: 8px;
                padding: 10px 10px;
            }
            .progress-mini {
                display: none;
            }
            .user-name { 
                font-size: 12px; 
            }
            .table-footnote { flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body class="py-5 px-3">

    <div class="compact-container">
        <div class="section-header">
            <span class="section-title">
                <i class="fa-solid fa-bolt"></i>
                <span>Трекер</span><strong>Активности</strong>
            </span>
            <div class="info-group">
                <span id="status" class="status-text anim-pulse">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Подключение
                </span>
                <div id="today-date" class="date-badge"></div>
            </div>
        </div>

        <div id="tracks-container" class="space-y-1">
            <!-- Сюда динамически загружаются карточки участников -->
        </div>

        <div class="table-footnote">
            <div class="footnote-legend">
                <span class="legend-item">
                    <span class="legend-dot" style="background-color: var(--active-day);"></span> Тренировка
                </span>
                <span class="legend-item">
                    <span class="legend-dot" style="background-color: var(--accent-soft);"></span> Отдых
                </span>
            </div>
            
            <div class="footnote-days-badge">
                <span class="footnote-days-label">Дни недели:</span>
                <div class="day-letter-box" style="background-color: var(--active-day); color: #ffffff; border-color: var(--active-day);">П</div>
                <div class="day-letter-box" style="background-color: var(--active-day); color: #ffffff; border-color: var(--active-day);">В</div>
                <div class="day-letter-box" style="background-color: var(--active-day); color: #ffffff; border-color: var(--active-day);">С</div>
                <div class="day-letter-box" style="background-color: var(--active-day); color: #ffffff; border-color: var(--active-day);">Ч</div>
                <div class="day-letter-box" style="background-color: var(--active-day); color: #ffffff; border-color: var(--active-day);">П</div>
                <div class="day-letter-box" style="background-color: var(--accent-soft); opacity: 0.9;">С</div>
                <div class="day-letter-box" style="background-color: var(--accent-soft); opacity: 0.9;">В</div>
            </div>
        </div>

        <div class="debug-panel">
            <div class="debug-header" onclick="toggleDebug()">
                <span><i class="fa-solid fa-bug"></i> Инспектор данных (Debug)</span>
                <span id="debug-toggle-icon"><i class="fa-solid fa-chevron-down"></i></span>
            </div>
            <div id="debug-content" class="debug-content">Загрузка диагностических данных...</div>
        </div>
    </div>

    <script>
        // Замените на ваш актуальный URL веб-приложения Google Apps Script (после деплоя новой версии)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzPOszPmAKzvS51vSUAGombHUEW8ucgaB5kXp-YIerboC2EGMJcMJITP7LKO7Stb9D/exec"; 

        function toggleDebug() {
            const content = document.getElementById('debug-content');
            const icon = document.getElementById('debug-toggle-icon');
            if (content.style.display === 'block') {
                content.style.display = 'none';
                icon.innerHTML = '<i class="fa-solid fa-chevron-down"></i>';
            } else {
                content.style.display = 'block';
                icon.innerHTML = '<i class="fa-solid fa-chevron-up"></i>';
            }
        }

        function setWeeklyRange() {
            const dateEl = document.getElementById('today-date');
            const now = new Date();
            const moscowTime = new Date(now.getTime() + (3 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60000));
            const endDate = new Date(moscowTime);
            endDate.setDate(moscowTime.getDate() - 1);
            const startDate = new Date(endDate);
            startDate.setDate(endDate.getDate() - 6);
            const monthNames = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
            const dateString = startDate.getMonth() === endDate.getMonth() 
                ? `${startDate.getDate()} - ${endDate.getDate()} ${monthNames[endDate.getMonth()]}`
                : `${startDate.getDate()} ${monthNames[startDate.getMonth()]} - ${endDate.getDate()} ${monthNames[endDate.getMonth()]}`;
            dateEl.innerHTML = `<i class="fa-regular fa-calendar"></i> ${dateString}`;
        }

        async function fetchData() {
            const statusEl = document.getElementById('status');
            const debugContentEl = document.getElementById('debug-content');
            setWeeklyRange();
            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error("Сетевая ошибка запроса к Apps Script");
                
                const rawJson = await response.json();
                
                console.group("🏆 Fitness Leaderboard Live Data");
                console.log(rawJson);
                console.groupEnd();
                
                debugContentEl.innerText = JSON.stringify(rawJson, null, 2);

                if (rawJson.error) { 
                    statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Ошибка данных';
                    renderDemo(); 
                    return; 
                }

                // Извлекаем массив из нового формата ответа { success: true, data: [...], _debug: {...} }
                const participants = Array.isArray(rawJson) ? rawJson : rawJson.data;
                
                render(participants);
                statusEl.innerHTML = '<i class="fa-solid fa-check"></i> Обновлено';
                statusEl.classList.remove('anim-pulse');
                statusEl.style.color = "var(--status-ok)"; 
            } catch (error) {
                console.error("Fetch error: ", error);
                debugContentEl.innerText = "Ошибка загрузки: " + error.toString() + "\n\nПожалуйста, убедитесь, что вы опубликовали новую версию скрипта в Google Apps Script и обновили SCRIPT_URL.";
                statusEl.innerHTML = '<i class="fa-solid fa-plug-circle-xmark"></i> Офлайн';
                renderDemo();
            }
        }

        function render(participants) {
            const container = document.getElementById('tracks-container');
            if (!participants || participants.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">Данные не найдены</div>';
                return;
            }

            const sorted = participants
                .map(p => {
                    let s = parseInt(p.streak, 10);
                    return {
                        ...p,
                        safeData: Array.isArray(p.data) ? p.data : [0,0,0,0,0,0,0],
                        total: Array.isArray(p.data) ? p.data.reduce((a, b) => a + b, 0) : 0,
                        streak: isNaN(s) ? 0 : s
                    };
                })
                .sort((a, b) => b.total - a.total);

            container.innerHTML = sorted.map((p, i) => {
                const rank = i + 1;
                const progressWidth = (p.total / 7) * 100;
                const rings = p.safeData.map(a => `<div class="day-ring ${a ? 'active' : ''}"></div>`).join('');
                
                const isInactive = p.streak <= 0;
                
                const streakHtml = `
                    <span class="streak-badge ${isInactive ? 'inactive' : ''}" title="Ударный режим: ${p.streak} нед.">
                        <svg width="11" height="13" viewBox="0 0 24 24" fill="${isInactive ? 'none' : 'currentColor'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2c1.4 2.5 3 4.5 4.5 7 2.1 3.5 1.5 8-1.5 10.5a7 7 0 0 1-9 0c-3-2.5-3.6-7-1.5-10.5 1.5-2.5 3.1-4.5 4.5-7z"></path>
                        </svg>
                        <span>${p.streak}</span>
                    </span>`;
                
                return `
                    <div class="leaderboard-card rank-${rank}">
                        <div class="rank-number">${rank}</div>
                        <div class="user-name-wrapper">
                            <div class="user-name" title="${p.name}">${p.name}</div>
                            ${streakHtml}
                        </div>
                        <div class="rings-container">${rings}</div>
                        <div class="progress-mini">
                            <div class="progress-fill" style="width: ${progressWidth}%"></div>
                        </div>
                        <div class="score-box">
                            <span class="score-value">${p.total}</span><span class="score-total">/7</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDemo() {
            const demoData = [
                { name: "Соломин Денис (Демо)", data: [1, 1, 1, 1, 1, 0, 0], streak: 1 },
                { name: "Мурадян Акоп (Демо)", data: [1, 1, 1, 1, 1, 1, 0], streak: 5 },
                { name: "Халитов Михаил (Демо)", data: [1, 1, 1, 0, 1, 0, 0], streak: 2 },
                { name: "Толстоноженко Александр (Демо)", data: [1, 0, 1, 1, 0, 0, 0], streak: 0 }
            ];
            render(demoData);
        }

        window.onload = fetchData;
    </script>
</body>
</html>
